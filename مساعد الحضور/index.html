<script>
// ===== تعليمات الذكاء الاصطناعي: عدلها من هنا =====
const AI_INSTRUCTIONS = `
الدور: أنت "مساعد الدوام"، مساعد شؤون موظفين يعرف سياسة الحضور والانصراف في شركة تجريبية.
المهمة: تجاوب على أسئلة الموظف عن الحضور والتأخير والاستئذان حسب هذي القواعد فقط:
- الدوام من 8:00 الصباح إلى 4:00 العصر.
- التأخير المسموح 15 دقيقة، يعني الحضور لين 8:15 ما يعتبر تأخير. بعدها يحسب تأخير من 8:00.
- الاستئذان حده الأقصى ساعتين في اليوم.
إذا ذكر الموظف وقت، احسب له بالدقائق ووضح النتيجة (متأخر أو لا، كم دقيقة، هل الاستئذان مسموح).
الأسلوب: ودود وواضح ومباشر، وخذ النتيجة أول شي ثم السبب.
اللهجة: سعودية
الطول: قصير، من جملتين إلى خمس جمل.
خارج الموضوع: إذا السؤال ما له علاقة بالحضور والانصراف، اعتذر بلطف وقل إنك تساعد بس في أسئلة الدوام والتأخير والاستئذان.
`;
// ===== نهاية التعليمات =====
</script>
<title>مساعد الدوام</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Reem+Kufi:wght@600&display=swap">
<style>
/* تخطيط: عمود واحد ضيق، بطاقة القواعد فوق ثم السؤال ثم الرد */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --fg:#1d2a28; --muted:#5d6f6b;
  --line:#d6e0dd; --accent:#0f6b5c; --accent-fg:#ffffff; --warn:#a2421c;
  --display:"Reem Kufi","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221f; --fg:#e4ece9; --muted:#9fb2ad;
  --line:#2c3a36; --accent:#4fbfa8; --accent-fg:#0b1412; --warn:#f08a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221f; --fg:#e4ece9; --muted:#9fb2ad;
  --line:#2c3a36; --accent:#4fbfa8; --accent-fg:#0b1412; --warn:#f08a62; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7}
main{max-width:640px;margin:0 auto;padding-block:28px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-size:1.9rem;margin:0;color:var(--accent);text-wrap:balance}
.sub{margin:0;color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rule{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);text-align:center}
.rule b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.rule span{font-size:.85rem;color:var(--muted)}
@media (max-width:420px){.rules{grid-template-columns:1fr}}
form{display:flex;flex-direction:column;gap:8px}
label{font-weight:700}
textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:110px;resize:vertical}
textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.count.full{color:var(--warn)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 22px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:500;padding:4px 12px;font-size:.9rem}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;white-space:pre-wrap;min-height:60px}
.answer.err{color:var(--warn);border-color:var(--warn)}
.note{font-size:.8rem;color:var(--muted);margin:0}
</style>

<main dir="rtl" lang="ar">
  <header>
    <h1>مساعد الدوام</h1>
    <p class="sub">اسأل عن الحضور والتأخير والاستئذان، والمساعد يرد عليك حسب سياسة الشركة.</p>
  </header>

  <section class="rules" aria-label="قواعد الدوام">
    <div class="rule"><b>8:00 – 4:00</b><span>ساعات الدوام</span></div>
    <div class="rule"><b>15 دقيقة</b><span>التأخير المسموح</span></div>
    <div class="rule"><b>ساعتين</b><span>أقصى استئذان</span></div>
  </section>

  <form id="ask">
    <label for="q">سؤالك</label>
    <textarea id="q" maxlength="500" placeholder="مثال: وصلت الساعة 8:20، هل يحسب علي تأخير؟"></textarea>
    <div class="chips">
      <button type="button" class="chip">وصلت 8:10، متأخر؟</button>
      <button type="button" class="chip">أبي أستأذن 3 ساعات، ينفع؟</button>
      <button type="button" class="chip">طلعت 3:30، كم نقصني؟</button>
    </div>
    <div class="row">
      <span class="count" id="count">0 / 500</span>
      <button type="submit" id="send">اسأل</button>
    </div>
  </form>

  <div class="answer" id="answer" aria-live="polite">اكتب سؤالك فوق واضغط «اسأل».</div>
  <p class="note">بيانات تجريبية. لا تكتب معلومات شخصية أو كلمات سر.</p>
</main>

<script>
const MAX = 500, TIMEOUT_MS = 30000;
const q = document.getElementById('q'), count = document.getElementById('count');
const send = document.getElementById('send'), answer = document.getElementById('answer');

function updateCount(){
  count.textContent = q.value.length + ' / ' + MAX;
  count.classList.toggle('full', q.value.length >= MAX);
}
q.addEventListener('input', updateCount);
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  q.value = c.textContent; updateCount(); q.focus();
}));

function show(text, isErr){ answer.textContent = text; answer.classList.toggle('err', !!isErr); }

document.getElementById('ask').addEventListener('submit', async e => {
  e.preventDefault();
  const text = q.value.trim().slice(0, MAX);
  if (!text) { show('اكتب سؤالك أول.', true); return; }

  const sample = window.claude ? await window.claude.use('sample') : null;
  if (!sample) { show('المساعد مو متاح هنا. افتح الصفحة من claude.ai وتأكد إنك مسجل دخول.', true); return; }

  send.disabled = true; show('جاري التفكير...');
  const ctrl = new AbortController();
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, TIMEOUT_MS);
  try {
    const res = await sample([{ role: 'user', content: AI_INSTRUCTIONS + '\n\nالتزم باللهجة المكتوبة في خانة "اللهجة" في كل ردك.\n\nسؤال الموظف:\n' + text }],
      { signal: ctrl.signal, cache: false, onText: ({ text }) => show(text) });
    show(res.text || 'ما وصل رد، جرب مرة ثانية.', !res.text);
  } catch (err) {
    if (timedOut) show('الرد تأخر أكثر من 30 ثانية. جرب مرة ثانية.', true);
    else if (err && err.code === 'not_granted') show('ما أعطيت الصفحة إذن تسأل Claude. اسمح لها من نافذة الإذن وجرب مرة ثانية.', true);
    else if (err && err.code === 'rate_limited') show('طلبات كثيرة. انتظر دقيقة وجرب مرة ثانية.', true);
    else show('صار خطأ: ' + ((err && err.message) || 'غير معروف') + '. جرب مرة ثانية.', true);
  } finally { clearTimeout(timer); send.disabled = false; }
});
</script>
